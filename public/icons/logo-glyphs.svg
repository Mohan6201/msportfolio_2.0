<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <filter id="glow-o" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-c" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- M — orange -->
  <polyline
    points="7,55 7,24 22,44 37,24 37,55"
    stroke="#ff6b35" stroke-width="5.5"
    stroke-linecap="round" stroke-linejoin="round"
    filter="url(#glow-o)"/>
  <circle cx="7" cy="24" r="2.8" fill="#ff6b35" filter="url(#glow-o)"/>
  <circle cx="37" cy="24" r="2.8" fill="#ff6b35" filter="url(#glow-o)"/>
  <!-- Bridge circuit trace -->
  <line x1="37" y1="39" x2="50" y2="39" stroke="#ff6b35" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
  <!-- S — cyan -->
  <path d="M 68 27 C 68 23 64 20 59 20 C 54 20 50 23 50 27 C 50 31 55 34 59 36 C 63 38 68 41 68 45 C 68 49 64 52 59 52 C 54 52 50 49 50 45"
    stroke="#00d4ff" stroke-width="5.5"
    stroke-linecap="round"
    filter="url(#glow-c)"/>
  <circle cx="68" cy="27" r="2.8" fill="#00d4ff" filter="url(#glow-c)"/>
  <circle cx="50" cy="45" r="2.8" fill="#00d4ff" filter="url(#glow-c)"/>
</svg>